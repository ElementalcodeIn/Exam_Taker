services:
  - type: web
    name: ceh-exam-taker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: EXAM_PIN
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
